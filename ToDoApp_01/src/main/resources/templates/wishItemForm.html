<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>欲しいもの登録</title>
	<link rel="stylesheet" href="/css/wishItemForm.css">
</head>

<body>
	<div class="form-container">
		<div class="form-header">
			<h1>欲しいものを登録する</h1>
		</div>
		<form id="wishItemForm">
			<div class="form-group">
				<label for="name" class="form-label">タイトル</label>
				<input type="text" id="name" name="name" class="form-input" required>
				<div class="error-message" id="nameError">タイトルを入力してください</div>
			</div>
			<div class="form-group">
				<label for="neededAmount" class="form-label">金額</label>
				<input type="number" id="neededAmount" name="neededAmount" class="form-input" step="0.01" required>
				<div class="error-message" id="amountError">金額を入力してください</div>
			</div>
			<div class="form-group">
				<label class="form-label">画像</label>
				<div class="image-upload" id="imageUpload">
					<input type="file" id="imageInput" name="image" accept="image/*" style="display: none;">
					<img id="imagePreview" class="image-preview">
					<div id="uploadPlaceholder">
						<div class="upload-icon">📸</div>
						<div class="upload-text">クリックして画像をアップロード</div>
						<div class="upload-hint">または画像をドラッグ＆ドロップ</div>
					</div>
				</div>
			</div>
			<input id="id" hidden>
			<div class="wrap-button">
				<button type="button" id="submit-button" class="submit-button">登録する</button>
				<button type="button" id="delete-button" class="delete-button">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
						stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M3 6h18"></path>
						<path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
						<path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
						<line x1="10" y1="11" x2="10" y2="17"></line>
						<line x1="14" y1="11" x2="14" y2="17"></line>
					</svg>
					<span>削除</span>
				</button>
			</div>
		</form>
	</div>
	<script src="/js/wishItemForm.js"></script>
</body>

</html>
