<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="_csrf" th:content="${_csrf.token}" />

	<title>Savings</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
	<link rel="stylesheet" href="/css/home.css">
</head>

<body>
	<div class="container">
		<header>
			<h1><span th:text="${username}"></span>さんの貯金箱</h1>
			<div>
				<a th:href="@{/api/savings/myPage}" class="button outline" type="button">マイページ</a>
				<a th:href="@{/api/savings/logout}" class="button outline" type="button">ログアウト</a>
			</div>
		</header>
		<div class="content">
			<div class="section">
				<div class="section-header">
					<h2>マイ浪費パターン</h2>
					<a th:href="@{/savings/mySavingRule}" class="button">新規追加</a>
				</div>
				<!--				<form th:action="@{/savings/user}" method="post" id="savings" class="form-vertical">-->
				<div class="wrap-list">
					<div th:each="myRule : ${myRuleList}" class="savings-rule" th:attr="data-id=${myRule.id}"
						th:data-frequency="${myRule.frequency}">
						<div th:id="'item-content-'+ ${myRule.id}" class="item-content" style="display: block">
							<div class="wrap-rule-title">
								<h5 class="card-title" th:text="${myRule.title}"></h5>
								<span class="open-edit-modal edit-icon" title="編集"
									th:attr="data-id=${myRule.id}">✎</span>
							</div>
							<p class="card-text" th:data-amount="${myRule.amount}">
							</p>
						</div>
						<div class="item-actions">
							<button type="submit" name="myRuleId" th:value="${myRule.id}" class="button small achieved"
								th:data-id="${myRule.id}">達成</button>
							<button type="button" class="button unachieved" th:data-id="${myRule.id}">未達成</button>
						</div>
					</div>
				</div>
				<!--				</form>-->
			</div>
			<div class="section">
				<section id="savings-box">
					<div id="piggy-bank">
						<div class="coin-icon">💰</div>
						<h2>貯金箱</h2>
						<div id="total-savings" class="total-amount" th:text="${totalSavings}"
							th:data-amount="${totalSavings}"></div>
						<button id="withdraw-button" class="button withdraw">取り崩す</button>
						<div class="purchase-status" id="purchaseStatus">購入可能なアイテムがあります！</div>
					</div>
				</section>
			</div>

			<div class="section">
				<div class="section-header">
					<h2>欲しいものリスト</h2>
					<a th:href="@{/savings/wishItem}" class="button">新規追加</a>
				</div>
				<div class="wishlist-grid">
					<div th:each="wishItem : ${wishList}" class="wishlist-item"
						th:attr="data-id=${wishItem.id}, data-name=${wishItem.name}, data-amount=${wishItem.neededAmount}, data-image=${wishItem.imagePath}">
						<img th:if="${wishItem.imagePath != 'no_image'}"
							th:src="@{/savings/api/wishItem/image(fileName=${wishItem.imagePath})}" class="item-bg" />
						<img th:if="${wishItem.imagePath == 'no_image'}" class="item-bg no-image" />
						<div class="item-content">
							<span class="status-badge status-incomplete">
								未達成
							</span>
							<div class="wrap-rule-title">
								<span class="card-title" th:text="${wishItem.name}"></span>
								<span class="transition-edit-item edit-icon" title="編集">✎</span>
							</div>
							<span class="wishItem-amount card-text" th:data-amount="${wishItem.neededAmount}"
								　th:text="${wishItem.neededAmount}"></span>
							<div class="progress-bar">
								<div class="progress" id="progressBar"></div>
							</div>

							<span th:text="${wishItem.id}" class="wish-item-id" style="display: none;"></span>
						</div>
					</div>
				</div>

			</div>
			<button class="manual-input">＋</button>
			<!--手動入力用モーダル-->
			<div id="manual-input-modal" class="modal-overlay">
				<div class="modal-content">
					<div class="modal-header">
						<h2 class="modal-title">貯金する額を入力</h2>
						<span class="modal-close">&times;</span>
					</div>
					<form id="edit-form">
						<div class="form-group">
							<label for="save-amount">貯金額</label>
							<input type="number" id="save-amount" name="amount" min="1" max="100000" step="1" required>
						</div>
						<input type="hidden" id="save-manual-input" name="id">
						<div class="modal-footer">
							<button type="button" class="button-modal save" id="save-manual-button">貯金</button>
						</div>
					</form>
				</div>
			</div>
			<!-- 編集用モーダル -->
			<div id="edit-modal" class="modal-overlay">
				<div class="modal-content">
					<div class="modal-header">
						<h2 class="modal-title">貯金ルールの編集</h2>
						<span id="close-edit-modal" class="modal-close">&times;</span>
					</div>
					<form id="edit-form">
						<div class="form-group">
							<label for="modal-title">説明</label>
							<input type="text" id="modal-title" name="title">
						</div>
						<div class="form-group">
							<label for="modal-amount">貯金額</label>
							<input type="text" id="modal-amount" name="amount">
						</div>
						<input type="hidden" id="modal-id" name="id">
						<div class="modal-footer">
							<button type="button" class="button-modal delete" id="delete-modal-button">削除</button>
							<button type="button" class="button-modal save" id="save-modal-button">保存</button>
						</div>
					</form>
				</div>
			</div>
			<!-- 削除確認モーダル -->
			<div id="deleteConfirmModal" class="modal-overlay">
				<div class="modal-content confirmation-modal">
					<div class="modal-header">
						<h2 class="modal-title">削除の確認</h2>
						<button class="modal-close" onclick="closeModal('deleteConfirmModal')">&times;</button>
					</div>
					<p>本当に削除しますか？<br>削除すると復元できません。</p>
					<div class="modal-footer">
						<button class="button-modal cancel" id="cancel-modal-button">キャンセル</button>
						<button class="button-modal delete" id="confirm-modal-button">削除する</button>
					</div>
				</div>
			</div>
			<!-- 取り崩し用モーダル-->
			<div id="withdraw-list-modal" class="modal-overlay">
				<div class="modal-content">
					<span id="close-withdraw-modal" class="modal-close">&times;</span>
					<h2>欲しいものリスト</h2>
					<form th:action="@{/savings/user/withdraw}" method="post">
						<div th:each="wishItem : ${wishList}" class="withdraw-item">
							<div class="item-content" th:attr="data-id=${wishItem.id},
							data-amount=${wishItem.neededAmount}">
								<h3 class="card-title" th:text="${wishItem.name}"></h3>
								<p class="card-text">
									<span class="withdraw-amount" th:text="${wishItem.neededAmount}"
										th:data-amount="${wishItem.neededAmount}"></span>
								</p>
							</div>
							<button type="submit" name="wishItemId" th:value="${wishItem.id}"
								class="button small">選択</button>
							<button type="button" name="" th:value="${wishItem.id}"
								class="button small select-borrow">前借して買う</button>
						</div>
					</form>
					<button id="borrow-btn" class="button small borrow">前借する</button>
				</div>
			</div>
			<!-- 前借購入確認モーダル -->
			<div id="borrowConfirmModal" class="modal-overlay">
				<div class="modal-content confirmation-modal">
					<div class="modal-header">
						<h2 class="modal-title">前借の確認</h2>
						<button class="modal-close" onclick="closeModal('borrowConfirmModal')">&times;</button>
					</div>
					<p>以下の内容で前借しますか？</p>
					<div class="modal-body">
						<ul>
							<li><strong>前借額：</strong><span id="borrow-amount"></span>円</li>
							<li><strong>現在の貯金額：</strong><span id="savings-amount"></span>円</li>
							<li><strong>前借後の必要返済額：</strong><span id="repayment-amount"></span>円</li>
						</ul>
					</div>
					<div class="modal-footer">
						<button class="button-modal cancel" id="cancel-borrw-button">キャンセル</button>
						<button class="button-modal delete" id="confirm-borrow-button">前借する</button>
					</div>
				</div>
			</div>
			<script src="/js/home.js"></script>
</body>

</html>
